header{background:linear-gradient(90deg,var(--navy1),var(--navy2));color:#fff;padding:10px 22px;display:flex;align-items:center;gap:12px;min-height:70px}
header img{height:46px;border-radius:4px;background:#fff}
header .t{flex:1}header h1{margin:0;font-size:17px;letter-spacing:.02em}header small{opacity:.65;font-size:12px}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.hbtn.on{background:#fff;color:var(--navy2);font-weight:600}
main{max-width:1500px;margin:0 auto;padding:16px 22px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.bar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;display:flex}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:12px 16px}header{flex-wrap:wrap}}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.col .hd{color:#fff;padding:12px 14px}
.col .hd h2{margin:0;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.col .hd p{margin:3px 0 0;font-size:12.5px;opacity:.9}
.col .hd .cnt{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);border-radius:12px;padding:3px 10px;font-size:12px}
.sec{padding:10px 14px 4px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.item{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13.5px;line-height:1.35;cursor:pointer}
.item:hover{background:#f8fafc}
.item .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px}
.b-Verified{background:#dcfce7;color:var(--ok)}.b-To{background:#ffedd5;color:var(--chk)}.b-Proposed{background:#ede9fe;color:var(--prop)}
.tag{font-size:11px;background:#f1f5f9;color:var(--muted);border-radius:10px;padding:2px 7px}
.id{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.det{display:none;margin-top:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.item.open .det{display:block}
.shared{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.shared h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy2)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sgrid .item{margin:0;border-left-color:var(--navy2)}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.empty{font-size:12.5px;color:var(--muted);padding:4px 0 10px}
</style>

  const out=[];let row=[],f='',i=0,qt=false;
  while(i<s.length){const c=s[i];
    if(qt){ if(c=='"'){ if(s[i+1]=='"'){f+='"';i++;} else qt=false; } else f+=c; }
    else if(c=='"') qt=true;
    else if(c==','){row.push(f);f='';}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&s[i+1]=='\n')i++; row.push(f);out.push(row);row=[];f=''; }
    else f+=c; i++; }
  if(f||row.length){row.push(f);out.push(row);}
  const h=out.shift().map(x=>x.trim());
  return out.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,j)=>[k,(r[j]||'').trim()])));
}
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt = r => (lang=='ro' && r.text_ro) ? r.text_ro : r.text_en;
const stCls = s => 'b-' + (s||'To check').split(' ')[0];
const match = r => (filt=='all' || r.status==filt) &&
  (!q || [r.text_en,r.text_ro,r.tool,r.source,r.notes,r.id].join(' ').toLowerCase().includes(q));

function itemHTML(r,color){
  const L=T[lang];
  const tools=(r.tool||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  return `<div class="item" style="border-left-color:${color}" onclick="this.classList.toggle('open')">
    ${esc(txt(r))}
    <div class="meta"><span class="badge ${stCls(r.status)}">${esc(L[r.status]||r.status)}</span>${tools}<span class="id">${esc(r.id)}</span></div>
    <div class="det"><b>${L.src}:</b> ${esc(r.source)||'—'}<br><b>${L.chk}:</b> ${esc(r.checked_by)||'—'} ${esc(r.date)}${r.notes?`<br><b>${L.notes}:</b> ${esc(r.notes)}`:''}</div>
  </div>`;
}
function render(){
  const L=T[lang];
  document.getElementById('lEN').classList.toggle('on',lang=='en');
  document.getElementById('lRO').classList.toggle('on',lang=='ro');
  document.documentElement.lang=lang;
  // summary
  const n=s=>rows.filter(r=>r.status==s).length, tot=rows.length;
  document.getElementById('summary').innerHTML=
    `<div class="stat"><b>${tot}</b><span>${L.total}</span></div>`+
    ['Verified','To check','Proposed'].map(s=>`<div class="stat"><b>${n(s)}</b><span>${L[s]}</span><div class="prog"><div style="width:${tot?n(s)/tot*100:0}%;background:${s=='Verified'?'var(--ok)':s=='To check'?'var(--chk)':'var(--prop)'}"></div></div></div>`).join('');
  // filter bar
  const bar=document.getElementById('bar');
  bar.innerHTML=['all','Verified','To check','Proposed'].map(s=>`<button class="chip ${filt==s?'on':''}" data-f="${s}">${s=='all'?L.all:L[s]} (${s=='all'?tot:n(s)})</button>`).join('')+
    `<input id="q" placeholder="${L.search}" value="${esc(q)}">`;
  bar.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render();});
  const qi=bar.querySelector('#q'); qi.oninput=e=>{q=e.target.value.toLowerCase();renderCols();};
  renderCols();
  document.getElementById('note').textContent=L.note;
}
function renderCols(){
  const L=T[lang];
  document.getElementById('grid').innerHTML=GROUPS.map(g=>{
    const ch=rows.filter(r=>r.group==g.key&&r.type=='Challenge'&&match(r));
    const sp=rows.filter(r=>r.group==g.key&&r.type=='Support'&&match(r));
    const c=g.aud.reduce((a,k)=>a+(counts[k]||0),0);
    return `<section class="col"><div class="hd" style="background:${g.color}">
      <h2>${g[lang][0]}</h2><p>${g[lang][1]}</p>
      <span class="cnt" title="${esc(g.aud.join(', '))}">${counts.__ok?c:'…'} ${L.stk}</span></div>
      <div class="sec"><h3 style="color:${g.color}">${L.ch}</h3>${ch.map(r=>itemHTML(r,g.color)).join('')||'<div class="empty">—</div>'}</div>
      <div class="sec"><h3 style="color:${g.color}">${L.sup}</h3>${sp.map(r=>itemHTML(r,g.color)).join('')||'<div class="empty">—</div>'}</div>
    </section>`;}).join('');
  document.getElementById('sharedT').textContent=L.shared;
  document.getElementById('sgrid').innerHTML=rows.filter(r=>r.type=='Solution'&&match(r)).map(r=>itemHTML(r,'var(--navy2)')).join('');
}
document.getElementById('lEN').onclick=()=>{lang='en';try{localStorage.setItem('chLang',lang)}catch(e){};render();};
document.getElementById('lRO').onclick=()=>{lang='ro';try{localStorage.setItem('chLang',lang)}catch(e){};render();};
render();

// live data: challenges sheet (optional) + stakeholder counts
if(SHEET_CSV_URL){
  fetch(SHEET_CSV_URL).then(r=>r.text()).then(t=>{const p=parseCSV(t); if(p.length){rows=p;render();}}).catch(e=>console.warn('Challenges sheet not loaded, using built-in data',e));
}
fetch(STAKEHOLDER_API).then(r=>r.json()).then(j=>{
  (j.data||[]).forEach(s=>{counts[s.audience]=(counts[s.audience]||0)+1}); counts.__ok=true; renderCols();
}).catch(e=>console.warn('Stakeholder counts not loaded',e));
</script>
</body>
</html>
