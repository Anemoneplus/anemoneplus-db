    else if(c=='"') qt=true;
    else if(c==','){row.push(f);f='';}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&s[i+1]=='\n')i++; row.push(f);out.push(row);row=[];f=''; }
    else f+=c; i++; }
  if(f||row.length){row.push(f);out.push(row);}
  const h=out.shift().map(x=>x.trim());
  return out.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,j)=>[k,(r[j]||'').trim()])));
}
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LANGS=[['en','EN'],['ro','RO'],['bg','BG'],['tr','TR'],['uk','UA']];
const txt = r => r['text_'+lang] || r.text_en;
const stCls = s => 'b-' + (s||'To check').split(' ')[0];
const match = r =>
  (!q || [txt(r),r['desc_'+lang],r.text_en,r.tool,r.source,r.notes,r.id].join(' ').toLowerCase().includes(q));

const CATORD={'Manage closely':0,'Keep satisfied':1,'Consult with':2,'Keep informed':3};
const CATCLS={'Manage closely':'d-mc','Keep satisfied':'d-ks','Consult with':'d-cw','Keep informed':'d-ki'};
const ALLAUD=GROUPS.flatMap(g=>g.aud);
function linked(r){
  const g=GROUPS.find(x=>x.key==r.group); const aud=g?g.aud:ALLAUD;
  let pool=STK.filter(s=>aud.includes(s.audience));
  const keys=(r.match||'').toLowerCase().split('|').map(x=>x.trim()).filter(Boolean);
  if(keys.length){const m=pool.filter(s=>{const t=((s.aoi||'')+' '+(s.expertise||'')).toLowerCase();return keys.some(k=>t.includes(k));}); if(m.length) pool=m;}
  return pool.sort((a,b)=>(CATORD[a.category]??9)-(CATORD[b.category]??9)||(+b.influence||0)-(+a.influence||0)||String(a.name).localeCompare(b.name));
}
function stkHTML(r){
  const L=T[lang];
  if(!counts.__ok) return `<div class="stk"><b>${L.loading}</b></div>`;
  const list=linked(r), full=allIds.has(r.id), show=full?list:list.slice(0,8);
  return `<div class="stk"><b>${L.linked} (${list.length})</b><ul>${show.map(s=>`<li><span class="dot ${CATCLS[s.category]||''}" title="${esc(s.category)}"></span>${esc(s.name)}<span class="c">${esc(s.country)}</span></li>`).join('')}</ul>
    ${list.length>8?`<button onclick="event.stopPropagation();toggleAll('${r.id}')">${full?L.showless:L.showall}</button>`:''}
    <div class="leg">${L.matched}</div></div>`;
}
function rigHTML(r){
  const L=T[lang], items=LIB.filter(i=>chOf(i).includes(r.id));
  let html='';
  if(items.length) html+=`<div class="igs">${items.map(i=>`<figure class="ig"><a href="${esc(i.url)}" target="_blank" rel="noopener" title="${esc(L.info[1])}"><img loading="lazy" src="${esc(i.thumb)}" alt="${esc(i.title)}"></a>
    <figcaption>${esc(i.title)}</figcaption>
    ${ADMIN?`<div class="adm-row"><button onclick="admForm('${esc(i.id)}')">✏️ Edit</button><button onclick="admDetach('${esc(i.id)}','${r.id}')">➖ Remove from this item</button><button class="del" onclick="admDelete('${esc(i.id)}')">🗑 Delete</button></div>`:''}</figure>`).join('')}</div>`;
  if(ADMIN){
    const others=LIB.filter(i=>!chOf(i).includes(r.id));
    html+=`<div class="adm-box"><b>Manage infographics for ${r.id}</b>
      <div class="adm-line"><select id="att-${r.id}"><option value="">— attach an existing infographic —</option>${others.map(i=>`<option value="${esc(i.id)}">${esc(i.title)}</option>`).join('')}</select>
      <button onclick="admAttach('${r.id}')">➕ Attach</button></div>
      <div class="adm-line"><button class="add" onclick="admForm(null,'${r.id}')">⬆️ Upload a new infographic</button></div></div>`;
  }
  return html;
}
function renderAdm(){const b=document.getElementById('admBtn');b.textContent=ADMIN?'🔓 Exit manage':'🔒';b.classList.toggle('on',!!ADMIN);b.onclick=ADMIN?admLogout:admOpen;}
/* ===== manage mode ===== */
function modal(html){let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';document.body.appendChild(m);}
  m.innerHTML=html?`<div class="mbox">${html}</div>`:'';m.style.display=html?'flex':'none';}
function admOpen(){
  if(!INFOG_API){modal(`<h3>Manage infographics</h3><p>The Infographics manager is not connected yet. Paste its Web app URL into <code>INFOG_API</code> in challenges.html.</p><div class="mact"><button onclick="modal('')">Close</button></div>`);return;}
  modal(`<h3>🔒 Manage infographics</h3><label>Password<input type="password" id="admPw" autocomplete="current-password"></label><p class="merr" id="merr"></p>
   <div class="mact"><button onclick="modal('')">Cancel</button><button class="pri" id="admGo">Unlock</button></div>`);
  const go=async()=>{const pw=document.getElementById('admPw').value;const r=await api({action:'check',password:pw});
    if(r.ok){ADMIN=pw;modal('');renderAdm();renderCols();}else document.getElementById('merr').textContent=r.error||'Error';};
  document.getElementById('admGo').onclick=go;document.getElementById('admPw').onkeydown=e=>{if(e.key=='Enter')go();};document.getElementById('admPw').focus();
}
function admLogout(){ADMIN=null;renderAdm();renderCols();}
async function api(body){
  try{const r=await fetch(INFOG_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return await r.json();}
  catch(e){return {ok:false,error:'Connection error: '+e.message};}
}
function admForm(id,preCh){
  const it=id?libById(id):null, sel=new Set(it?chOf(it):(preCh?[preCh]:[]));
  const groups=[...GROUPS.map(g=>g.key),'Shared'];
  const list=groups.map(g=>`<fieldset><legend>${g=='Shared'?'Shared solutions':g}</legend>${rows.filter(r=>r.group==g).map(r=>
    `<label class="ck"><input type="checkbox" value="${r.id}" ${sel.has(r.id)?'checked':''}><span><b>${r.id}</b> ${esc(r.text_en)}</span></label>`).join('')}</fieldset>`).join('');
  modal(`<h3>${it?'✏️ Edit infographic':'➕ Add infographic'}</h3>
    ${it?`<img class="mprev" src="${esc(it.thumb)}" alt="">`:`<label>Image file (JPG / PNG)<input type="file" id="fImg" accept="image/jpeg,image/png,image/webp"></label><img class="mprev" id="fPrev" alt="" style="display:none">`}
    <label>Title<input id="fTitle" value="${esc(it?it.title:'')}" maxlength="150"></label>
    <label>Category<select id="fCat">${['P','T','S'].map(c=>`<option value="${c}" ${(it?it.cat:'P')==c?'selected':''}>${T.en.cats[c]}</option>`).join('')}</select></label>
    <div class="mlbl">Assign to key challenges / support items</div><div class="mlist">${list}</div>
    <p class="merr" id="merr"></p>
    <div class="mact"><button onclick="modal('')">Cancel</button><button class="pri" id="fSave">${it?'Save changes':'Upload'}</button></div>`);
  const fi=document.getElementById('fImg');
  if(fi) fi.onchange=()=>{const f=fi.files[0];if(!f)return;const p=document.getElementById('fPrev');p.src=URL.createObjectURL(f);p.style.display='block';
    const t=document.getElementById('fTitle');if(!t.value)t.value=f.name.replace(/\.[^.]+$/,'').replace(/^\d+[_-]/,'').replace(/[_-]+/g,' ');};
  document.getElementById('fSave').onclick=async()=>{
    const btn=document.getElementById('fSave'),err=document.getElementById('merr');
    const body={password:ADMIN,title:document.getElementById('fTitle').value.trim(),category:document.getElementById('fCat').value,
      challenges:[...document.querySelectorAll('.mlist input:checked')].map(x=>x.value).join(';')};
    if(!body.title){err.textContent='Please enter a title.';return;}
    if(it){body.action='update';body.id=it.id;}
    else{const f=fi.files[0];if(!f){err.textContent='Please choose an image.';return;}
      btn.disabled=true;btn.textContent='Preparing image…';
      try{const im=await shrink(f);body.action='add';body.image=im.b64;body.mime=im.mime;}catch(e){err.textContent='Could not read image.';btn.disabled=false;btn.textContent='Upload';return;}}
    btn.disabled=true;btn.textContent='Saving…';
    const r=await api(body);
    if(r.ok){setLib(r.data);modal('');}else{err.textContent=r.error||'Error';btn.disabled=false;btn.textContent=it?'Save changes':'Upload';if(r.error=='Wrong password'){ADMIN=null;renderAdm();renderCols();}}
  };
}
async function admSave(it,chs){
  const r=await api({action:'update',password:ADMIN,id:it.id,title:it.title,category:it.cat,challenges:chs.join(';')});
  if(r.ok) setLib(r.data); else modal(`<h3>Error</h3><p>${esc(r.error||'Error')}</p><div class="mact"><button onclick="modal('')">Close</button></div>`);
}
function admAttach(rid){const v=document.getElementById('att-'+rid).value;if(!v)return;const it=libById(v);admSave(it,[...new Set([...chOf(it),rid])]);}
function admDetach(id,rid){const it=libById(id);admSave(it,chOf(it).filter(x=>x!=rid));}
async function admDelete(id){
  const it=libById(id);
  modal(`<h3>🗑 Delete infographic?</h3><img class="mprev" src="${esc(it.thumb)}" alt=""><p><b>${esc(it.title)}</b> will be removed from the website and from all items it is attached to.</p><p class="merr" id="merr"></p>
    <div class="mact"><button onclick="modal('')">Cancel</button><button class="pri danger" id="dGo">Delete</button></div>`);
  document.getElementById('dGo').onclick=async()=>{const b=document.getElementById('dGo');b.disabled=true;b.textContent='Deleting…';
    const r=await api({action:'delete',password:ADMIN,id});if(r.ok){setLib(r.data);modal('');}else{document.getElementById('merr').textContent=r.error||'Error';b.disabled=false;b.textContent='Delete';}};
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const max=2000,s=Math.min(1,max/img.width);
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const d=c.toDataURL('image/jpeg',0.86);res({mime:'image/jpeg',b64:d.split(',')[1]});};img.onerror=rej;img.src=URL.createObjectURL(file);});}
function setLib(data){
  if(!Array.isArray(data)) return;
  LIB.length=0;
  data.forEach(d=>LIB.push({id:String(d.id),title:d.title,cat:d.category||'S',url:d.url,thumb:d.thumb||d.url,challenges:String(d.challenges||'').split(/[;,\s]+/).filter(Boolean)}));
  renderCols();
}
function toggleAll(id){allIds.has(id)?allIds.delete(id):allIds.add(id);renderCols();}
function toggleOpen(id){openIds.has(id)?openIds.delete(id):openIds.add(id);renderCols();}
function itemHTML(r,color){
  const L=T[lang], open=openIds.has(r.id);
  const tools=(r.tool||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  const nIg=LIB.filter(i=>chOf(i).includes(r.id)).length;
  return `<div class="item ${open?'open':''}" style="border-left-color:${color}" onclick="if(!event.target.closest('a,button,select,input'))toggleOpen('${r.id}')">
    <div class="ttl"><span>${esc(txt(r))}</span><span class="chev">${open?'▴':'▾'}</span></div>
    ${tools||nIg||ADMIN?`<div class="meta">${tools}${nIg?`<span class="tag ig-tag">🖼️ ${nIg}</span>`:''}${ADMIN?`<span class="id">${esc(r.id)}</span>`:''}</div>`:''}
    ${open?`<div class="det">${r['desc_'+lang]||r.desc_en?`<p class="desc">${esc(r['desc_'+lang]||r.desc_en)}</p>`:''}${rigHTML(r)}${stkHTML(r)}</div>`:''}
  </div>`;
}
function render(){
  const L=T[lang];
  const lg=document.getElementById('langs');
  lg.innerHTML=LANGS.map(([k,l])=>`<button class="hbtn ${lang==k?'on':''}" data-l="${k}">${l}</button>`).join('');
  lg.querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render();});
  document.documentElement.lang=lang;
  const bar=document.getElementById('bar');
  bar.innerHTML=`<input id="q" placeholder="${L.search}" value="${esc(q)}">`;
  const qi=bar.querySelector('#q'); qi.oninput=e=>{q=e.target.value.toLowerCase();renderCols();};
  renderCols();
  document.getElementById('note').textContent=L.note;
  renderAdm();
  document.getElementById('infoT').textContent=L.info[0];document.getElementById('infoOpen').textContent=L.info[1];document.getElementById('infoDl').textContent=L.info[2];
}
function renderCols(){
  const L=T[lang];
  document.getElementById('grid').innerHTML=GROUPS.map(g=>{
    const ch=rows.filter(r=>r.group==g.key&&r.type=='Challenge'&&match(r));
    const sp=rows.filter(r=>r.group==g.key&&r.type=='Support'&&match(r));
    const c=g.aud.reduce((a,k)=>a+(counts[k]||0),0);
    return `<section class="col"><div class="hd" style="background:${g.color}">
      <h2>${g[lang][0]}</h2><p>${g[lang][1]}</p>
      <span class="cnt" title="${esc(g.aud.join(', '))}">${counts.__ok?c:'…'} ${L.stk}</span></div>
      <div class="sec"><h3 style="color:${g.color}">${L.ch}</h3>${ch.map(r=>itemHTML(r,g.color)).join('')||'<div class="empty">—</div>'}</div>
      <div class="sec"><h3 style="color:${g.color}">${L.sup}</h3>${sp.map(r=>itemHTML(r,g.color)).join('')||'<div class="empty">—</div>'}</div>
    </section>`;}).join('');
  document.getElementById('sharedT').textContent=L.shared;
  document.getElementById('sgrid').innerHTML=rows.filter(r=>r.type=='Solution'&&match(r)).map(r=>itemHTML(r,'var(--navy2)')).join('');
}
render();

// live data: challenges sheet (optional) + stakeholder counts
if(INFOG_API){
  fetch(INFOG_API).then(r=>r.json()).then(j=>{if(j.data&&j.data.length)setLib(j.data);}).catch(e=>console.warn('Infographics list not loaded, using built-in list',e));
}
if(SHEET_CSV_URL){
  fetch(SHEET_CSV_URL).then(r=>r.text()).then(t=>{const p=parseCSV(t); if(p.length){rows=p;render();}}).catch(e=>console.warn('Challenges sheet not loaded, using built-in data',e));
}
fetch(STAKEHOLDER_API).then(r=>r.json()).then(j=>{
  STK=j.data||[]; STK.forEach(s=>{counts[s.audience]=(counts[s.audience]||0)+1}); counts.__ok=true; renderCols();
}).catch(e=>console.warn('Stakeholder counts not loaded',e));
</script>
